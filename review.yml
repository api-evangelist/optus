aid: optus
name: Optus
review:
  question: >-
    Does Optus — Australia's second-largest mobile network operator — publish a real,
    self-serve public API surface, and what is its CAMARA / GSMA Open Gateway posture?
  answer: partial
  date: '2026-07-25'
  reviewer: API Evangelist
  homeMarket: Australia
  tier: mno-carrier
  gated: true
findings:
  summary: |
    Optus is split down the middle. It operates exactly one genuinely public, self-serve
    developer surface — The Optus SMS Suite at sms.optus.com.au — and that surface is not
    Optus-built: it is a white-label of New Zealand's Modica Group (sms.optus.com.au resolves
    to omni-cf-optus.modicagroup.com, harvested specs carry Modica Group API Support as the
    contact, and two of the four published definitions still declare api.modicagroup.com as
    their server). Inside that surface the documentation is open, complete, and unusually good
    for a carrier: ten documented messaging interfaces, three downloadable Swagger/OpenAPI
    documents linked directly from the docs, a publicly served WSDL, an unauthenticated live
    status API, and a self-serve free-trial signup.

    Everything else Optus does is partner-gated or absent. There is no first-party carrier
    developer portal: developer.optus.com.au and api.optus.com.au both resolve on Akamai and
    return HTTP 403 "Access Denied" (Akamai edgesuite error pages, not application 401/login
    walls) — hostnames that exist but serve nothing to the public. opengateway.optus.com.au,
    developers.opengateway.optus.com.au, developers.optus.com.au, docs.optus.com.au,
    iot/m2m/networkapi/sandbox/dev/partner subdomains either do not resolve or resolve to
    non-serving addresses. Every www path probed (/developer, /developers, /api,
    /business/api, /opengateway) returns 404. The IoT surface is a Cisco/Jasper Control Centre
    at optus.m2m.com whose "Access to APIs" is sold as part of a A$150 IoT Starter Kit that
    itself requires a referral code — a sales-gated platform, not a developer programme.

    On network APIs, Optus is a joiner, not a publisher. It is a stated GSMA Open Gateway
    participant and one of fourteen operators endorsing the Bridge Alliance API Exchange
    (BAEx), which is powered by parent company Singtel's Paragon orchestration platform and
    partners with Aduna. Singtel — Optus's owner — is an Aduna venture partner; Optus is not
    named as one directly. As of this review date no CAMARA API is callable from any Optus
    host, and no Optus CAMARA endpoint, sandbox, or specification could be found. Telstra beat
    Optus to market in Australia, going live with Number Verification and handing Number
    Verification and SIM Swap to Aduna Global; Optus's own contribution to the record is a
    spokesperson statement about "a major step in making available standardised, network-level
    capabilities" and a promise of "more to come in the next few weeks." That is a press
    release, not an implementation. Optus's route to developers for network APIs runs through
    its parent's exchange and through aggregators — not through anything Optus publishes.
  developerPortal:
    firstPartyCarrierPortal: false
    url: https://sms.optus.com.au/docs/en/developer-docs/
    httpStatus: 200
    confirmed: true
    kind: >-
      Real self-serve documentation portal, but for a single white-labelled enterprise
      messaging product (The Optus SMS Suite, powered by Modica Group) — not a carrier
      network-API portal.
    selfServeSignup: https://sms.optus.com.au/customer/online_signup
    signupHttpStatus: 200
  probes:
  - url: https://developer.optus.com.au/
    status: 403
    note: >-
      Host resolves via Akamai (developer.optus.com.au.d.edgekey.net). Body is an Akamai
      "Access Denied" edgesuite error page, not an application login. Nothing public.
  - url: https://api.optus.com.au/
    status: 403
    note: Same Akamai "Access Denied" edge response (api.optus.com.au.edgekey.net).
  - url: https://developers.optus.com.au/
    status: 000
    note: DNS does not resolve.
  - url: https://docs.optus.com.au/
    status: 000
    note: DNS does not resolve.
  - url: https://opengateway.optus.com.au/
    status: 000
    note: DNS does not resolve — no Open Gateway subdomain (contrast Telefonica's developers.opengateway.telefonica.com).
  - url: https://developers.opengateway.optus.com.au/
    status: 000
    note: DNS does not resolve.
  - url: https://www.optus.com.au/developer
    status: 404
  - url: https://www.optus.com.au/developers
    status: 404
  - url: https://www.optus.com.au/api
    status: 404
  - url: https://www.optus.com.au/business/api
    status: 404
  - url: https://www.optus.com.au/opengateway
    status: 404
  - url: https://sms.optus.com.au/docs/en/developer-docs/
    status: 200
    note: The one real public developer documentation area.
  - url: https://optus.m2m.com/
    status: 200
    note: >-
      Cisco/Jasper-style IoT Control Centre landing page. "Access to APIs" is listed as an
      inclusion of the A$150 IoT Starter Kit, which requires a referral code. No public API
      documentation, no specification, sales-gated.
  - url: https://www.optus.com.au/.well-known/openid-configuration
    status: 404
  - url: https://sms.optus.com.au/.well-known/openid-configuration
    status: 404
  openapiHarvested: true
  specsCount: 4
  specs:
  - file: openapi/optus-sms-suite-rest-v1-openapi.yml
    sourceURL: https://sms.optus.com.au/docs/api/mobile-gateway-rest-v1.yaml
    httpStatus: 200
    fetched: '2026-07-25'
    format: Swagger 2.0
    title: The Optus SMS Suite REST API 1.0.0
    host: api.sms.optus.com.au
    basePath: /rest/gateway
    paths:
    - /messages
    - /messages/broadcast
    - /messages/{messageid}
    security: BasicAuth
    note: Linked as a download from the REST v1 documentation page. Saved verbatim.
  - file: openapi/optus-sms-suite-rest-v2-openapi.yml
    sourceURL: https://sms.optus.com.au/docs/api/mobile-gateway-rest-v2.yaml
    httpStatus: 200
    fetched: '2026-07-25'
    format: OpenAPI 3.0.3
    title: SMS Gateway REST APIv2 1.0.0
    servers:
    - https://api.sms.optus.com.au/rest/sms/v2
    paths:
    - /openapi.yaml
    - /messages
    security: GatewayAuthorizer (apiKey in Authorization header; HTTP Basic value)
    note: >-
      Linked as a download from the REST v2 documentation page. Saved verbatim. Note that the
      spec also documents a live GET /openapi.yaml operation on the API itself — that runtime
      endpoint returned HTTP 404 {"message":"Not Found"} when called anonymously, so the
      self-describing copy is credential-gated even though the docs-hosted copy is public.
  - file: openapi/optus-sms-suite-campaign-manager-openapi.yml
    sourceURL: https://sms.optus.com.au/docs/api/campaign-manager.yaml
    httpStatus: 200
    fetched: '2026-07-25'
    format: Swagger 2.0
    title: Campaign Manager 1.0.1
    host: api.sms.optus.com.au
    basePath: /rest/campaign_manager/v1
    paths:
    - /{application_name}/lists
    - /{application_name}/lists/{list_id}
    - /{application_name}/delete_multiple_lists
    - /{application_name}/scheduled_campaigns
    - /{application_name}/templates
    - /{application_name}/{campaign_id}/report
    security: BasicAuth
    note: >-
      An equivalent Swagger 2.0 document is also served live at
      https://api.sms.optus.com.au/rest/campaign_manager/v1/swagger.json (HTTP 200), but that
      copy declares host api.modicagroup.com. The Optus-branded docs copy was kept.
  - file: openapi/optus-sms-suite-status-openapi.json
    sourceURL: https://api.sms.optus.com.au/rest/services/v1/swagger.json
    httpStatus: 200
    fetched: '2026-07-25'
    format: OpenAPI 3.0.0
    title: Omni Status API 1.0.1
    servers:
    - https://api.modicagroup.com/rest/services/v1
    paths:
    - /status
    - /services
    security: none (unauthenticated)
    note: >-
      Served from an Optus host but declares the Modica Group server and Modica Group support
      contact — the clearest evidence that this whole surface is a white-label. Saved verbatim
      without correcting the server. The API was called live and answered:
      GET https://api.sms.optus.com.au/rest/services/v1/status?service=rest&service=smpp
      returned HTTP 200 {"services":{"rest":{"status":"available"},"smpp":{"status":"available"}}}.
  otherArtifacts:
  - type: WSDL
    url: https://api.sms.optus.com.au/ModicaSoap.wsdl
    httpStatus: 200
    note: >-
      Publicly served SOAP WSDL, targetNamespace http://api.sms.optus.com.au/ModicaSoap,
      describing sendMessage. Referenced by URL rather than copied into openapi/.
  camara:
    posture: >-
      Stated GSMA Open Gateway participant and Bridge Alliance API Exchange endorser with
      nothing callable — press release, not implementation.
    apisWithEvidence: []
    exposesCamaraApis: false
    evidence: |
      No CAMARA API endpoint, sandbox, specification, or documentation was found on any Optus
      host. No Optus CAMARA repository or contribution was located, and no Optus network-API
      portal exists. The only first-party record is an Optus spokesperson quoted in Australian
      trade press describing participation in GSMA Open Gateway with Telstra as "a major step
      in making available standardised, network-level capabilities such as fraud prevention and
      secure digital authentication in the Australian market," plus a statement that there is
      "more to come on the collaboration with Telstra in the next few weeks." Telstra, not
      Optus, went live first in Australia — with Number Verification, and by releasing Number
      Verification and SIM Swap to Aduna Global. Optus has announced intent; it has not shipped
      a callable CAMARA API that this review could reach.
    openGatewayMember: true
    openGatewayEvidence: >-
      Named in Australian trade press as participating in the GSMA Open Gateway initiative
      alongside Telstra. Not verifiable against the GSMA's own operator list during this review
      — open-gateway.gsma.com and gsma.com/solutions-and-impact/gsma-open-gateway/ both
      returned HTTP 403 to anonymous fetches.
    aduna:
      directVenturePartner: false
      note: >-
        Optus is not among Aduna's twelve operator venture partners. Its parent, Singtel, is.
        Optus therefore reaches Aduna indirectly, through Singtel.
    bridgeAlliance:
      endorser: true
      exchange: Bridge Alliance API Exchange (BAEx)
      note: >-
        Optus is one of the operators (alongside Airtel, AIS, China Unicom, CSL, CTM, Globe,
        Maxis, MobiFone, Singtel, SK Telecom, stc, Taiwan Mobile and Telkomsel) that endorsed
        BAEx. BAEx is powered by Singtel's Paragon orchestration platform, sells GSMA Open
        Gateway APIs to multi-market enterprises under a single integration and contract, and
        has partnered with Aduna. BAEx markets Silent Network Authentication APIs — Number
        Verify and SIM Swap — at the exchange level; this review found no evidence tying those
        to an Optus-served endpoint.
    channelToDevelopers: >-
      Indirect. For network APIs, Optus reaches developers through parent Singtel's Bridge
      Alliance API Exchange and through Aduna and CPaaS channel partners — not through any
      Optus-published portal or specification.
  tmForum:
    conformanceFound: false
    note: >-
      No TM Forum Open API conformance certification (TMF620, TMF622, TMF641 or any other) was
      found for Optus. No public TM Forum Open API endpoint is exposed.
  threeGppExposure:
    nefOrScef: false
    networkSlicingApi: false
    edgeMecApi: false
    note: >-
      No NEF/SCEF surface, network-slicing API, or edge/MEC API is publicly documented. The
      only 3GPP-derived interface Optus publishes is the MM7 MMS protocol implementation in the
      SMS Suite, which is a messaging interconnect, not a network-exposure function.
  auth:
    schemes:
    - HTTP Basic Authentication (all Optus SMS Suite REST, SOAP, MM7, and 2FA interfaces)
    - None (Health Monitoring API is deliberately unauthenticated)
    - SMPP bind credentials over mandatory TLS 1.2+ (SMPP interface)
    oauth2: false
    ciba: false
    mtls: false
    cibaNote: >-
      CIBA (Client-Initiated Backchannel Authentication), which CAMARA specifies alongside OIDC
      for network-based authorization, does not appear anywhere in Optus's public surface. No
      OIDC discovery document is served: /.well-known/openid-configuration returned 404 on both
      www.optus.com.au and sms.optus.com.au, and /.well-known/oauth-authorization-server was
      likewise absent. The published auth model is 2005-era HTTP Basic.
    credentialIssuance: >-
      Per-application username/password generated inside the SMS Suite platform at
      https://sms.optus.com.au/gateway/api_config/{rest|restv2|http|soap|smpp|mms}.
    federatedIdentity: >-
      The platform itself (not the APIs) supports Federated ID and SCIM user provisioning from
      an external IdP, documented at https://sms.optus.com.au/docs/en/security/.
  webhooks:
    present: true
    asyncapiPublished: false
    events:
    - Delivery receipt (DLR) callbacks — mandatory on REST v2, available on REST v1, HTTPS API, and REST Email
    - Mobile-originated (MO) inbound SMS callbacks
    - MM7 mobile-originated MMS callbacks (SOAP, acknowledged with a SOAP response)
    - MM7 delivery-report callbacks
    note: >-
      Real, documented callback surface, but described only in prose. No AsyncAPI document is
      published and no event schema registry exists.
  sdks:
    firstPartyPackages: []
    note: >-
      No first-party Optus SDK was found on npm, and the github.com/Optus organisation exists
      with zero public repositories. The npm packages matching "optus" are third-party or
      security-research artifacts, not published by Optus. The docs ship inline curl, Ruby,
      Python, Java, Go, JavaScript, and PHP code samples (Slate/widdershins-generated) instead
      of SDKs.
  postman:
    publicWorkspace: false
    note: No public Optus Postman workspace or collection was located.
  graphql:
    present: false
    note: No GraphQL endpoint was found or documented.
  grpc:
    present: false
  thirdPartyIntegrations:
  - Genesys Cloud (BYO SMPP)
  - Marketo Engage (webhook-triggered SMS)
  - Salesforce CRM (TXTinIT)
  - Zapier
  - Okta Telephony Inline Hook
  whiteLabelFinding: >-
    The Optus SMS Suite is operated by Modica Group. sms.optus.com.au resolves to
    omni-cf-optus.modicagroup.com; support is optussd@modicagroup.com; the docs footer links
    modicagroup.com; and two harvested specifications name api.modicagroup.com as the server
    and Modica Group API Support as the contact. Optus is reselling a vendor's messaging
    platform under its own brand and domain — which is what produces the one respectable
    developer experience in its estate.
  transports:
  - protocol: REST
    scheme: https
    baseURL: https://api.sms.optus.com.au/rest/gateway
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://api.sms.optus.com.au/rest/sms/v2
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://api.sms.optus.com.au/rest/campaign_manager/v1
    documented: true
  - protocol: REST
    scheme: https
    baseURL: https://api.sms.optus.com.au/rest/services/v1
    documented: true
    note: Unauthenticated status endpoint; confirmed live with a 200 response.
  - protocol: HTTP GET
    scheme: https
    baseURL: https://api.sms.optus.com.au/message
    documented: true
    note: Legacy query-string SMS interface.
  - protocol: SOAP
    scheme: https
    documented: true
    note: WSDL served at https://api.sms.optus.com.au/ModicaSoap.wsdl
  - protocol: MM7
    scheme: https
    documented: true
    note: 3GPP MM7 SOAP multipart MMS submission to /mm7.
  - protocol: SMPP
    scheme: tls
    documented: true
    note: SMPP 3.3 and 3.4, TLS mandatory.
  - protocol: GraphQL
    documented: false
  - protocol: WebSocket
    documented: false
  - protocol: gRPC
    documented: false
