  - {code: 'Missing <parameter name> parameter', description: The parameter named is missing or the gateway is unable to identify it, http_v1: 500, http_v2: 400}
  - {code: Failed to queue message, description: 'The gateway was unable to create the message - most likely an invalid destination number or a mobile network not set up on the account', http_v1: 500, http_v2: 400}
