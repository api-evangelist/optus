generated: '2026-07-25'
method: searched
source: https://sms.optus.com.au/docs/en/ (per-interface "Error Codes" reference tables)
format: vendor-json
rfc9457: false
note: >-
  The Optus SMS Suite does not use RFC 9457 problem+json. Each interface publishes its own
  error table and its own envelope; the REST family returns a small JSON object, SOAP returns
  a fault with a Modica.* code, MM7 returns 3GPP MM7 numeric status classes, and the legacy
  HTTPS API returns a bare text body whose HTTP status depends on the requested API version.
  Every entry below is transcribed from the published documentation - none are inferred.
envelopes:
- api: SMS Gateway REST API v1
  spec: openapi/optus-sms-suite-rest-v1-openapi.yml
  shape: '{"code": integer, "message": string}'
  schema: DefaultError
- api: SMS Gateway REST API v2
  spec: openapi/optus-sms-suite-rest-v2-openapi.yml
  shape: '{"message": string, "statusCode": integer, "error": string}'
  schema: ApiErrorResponse
- api: Campaign Manager API
  spec: openapi/optus-sms-suite-campaign-manager-openapi.yml
  shape: '{"code": integer, "message": string}'
  example: '{"code": 401, "message": "unauthenticated for invalid credentials"}'
  schema: DefaultError
- api: REST Email API
  shape: '{"code": integer, "message": string}'
  variant: '{"error": string, "error-desc": string}  # scheduled-date validation'
- api: SOAP API
  shape: SOAP fault carrying a Modica.* code and description
- api: MM7 MMS API
  shape: MM7 StatusCode + StatusText in the MM7 SOAP response
- api: HTTPS API
  shape: plain-text body; HTTP status differs between version=1 and version=2
- api: Health Monitoring API
  spec: openapi/optus-sms-suite-status-openapi.json
  shape: '{"message": string}'
