delivery_statuses:
  note: >-
    Not errors, but the reconciliation vocabulary an integration must handle. Delivery
    outcomes arrive asynchronously on the DLR callback, not on the submit response.
  dlr_callback:
  - {status: sent, description: Message has been sent by the carrier transport}
  - {status: received, description: Message has been received}
  - {status: rejected, description: The carrier rejected the message}
  - {status: expired, description: 'The carrier was unable to deliver the message within a specified amount of time - for instance when the phone was turned off'}
  platform_reporting:
  - {status: submitted, description: Message successfully submitted to the carrier for delivery}
  - {status: sent, description: Message has been sent by the carrier transport}
  - {status: received, description: Message has been received}
  - {status: frozen, description: A transient error has frozen this message}
  - {status: rejected, description: The carrier rejected the message}
  - {status: failed, description: Message delivery has failed due to a carrier connectivity issue}
  - {status: dead, description: Message killed by an administrator}
  - {status: expired, description: The carrier was unable to deliver the message in a specified amount of time}
  spec_enum:
    source: openapi/optus-sms-suite-rest-v2-openapi.yml#/components/schemas/StatusCallback
    values: [accepted, queued, submitted, sent, received, blocked, deficient, frozen, rejected, failed, dead, expired]
    note: >-
      The OpenAPI enum is wider than either published table - accepted, queued, blocked and
      deficient appear only in the machine-readable spec.
