    x-artifacts:
      authentication: authentication/optus-authentication.yml
      conventions: conventions/optus-conventions.yml
      errors: errors/optus-error-codes.yml
      data_model: data-model/optus-data-model.yml
- target: $.info
  update:
    x-conventions:
      tenancy: 'every path is scoped by the {application_name} segment, which is also the Basic auth username'
      pagination: none - list and template collections return in full
      idempotency: none
- target: $.paths['/{application_name}/scheduled_campaigns'].post
  update:
    summary: Schedule an SMS campaign
    x-action-class: acting
    x-consequence: physical
    x-blast-radius: >-
      Highest-consequence operation on the entire Optus public surface. The spec permits up to
      1,000,000 members in a single request and the send is scheduled, not previewed. Agentic
      callers should require explicit human confirmation.
    x-human-in-the-loop: recommended
    x-agentic-access: agentic-access/optus-agentic-access.yml
- target: $.paths['/{application_name}/delete_multiple_lists'].post
  update:
    summary: Delete up to 100 recipient lists
    x-action-class: acting
    x-consequence: write
    x-irreversible: true
- target: $.paths['/{application_name}/lists/{list_id}'].delete
  update:
    summary: Delete a recipient list
    x-action-class: acting
    x-consequence: write
    x-irreversible: true
- target: $.paths['/{application_name}/lists'].post
  update:
    summary: Create a recipient list and load its members
    x-action-class: acting
    x-consequence: write
- target: $.paths['/{application_name}/lists'].get
  update:
    summary: List all active recipient lists
    x-action-class: connected
    x-consequence: read
- target: $.paths['/{application_name}/templates'].get
  update:
    summary: List all message templates
    x-action-class: connected
    x-consequence: read
- target: $.paths['/{application_name}/{campaign_id}/report'].get
  update:
