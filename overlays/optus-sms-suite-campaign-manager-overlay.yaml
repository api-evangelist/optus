      remove_opt_outs defaults to true and is the only opt-out control on the surface; there is
      no API to read or manage opt-out records. Australian and New Zealand consent rules are
      documented at
      https://sms.optus.com.au/docs/en/useful-information/message-compliance-and-regulatory-information/
- target: $.definitions.Member
  update:
    x-apievangelist-note: >-
      param1..param6 are free-text merge fields (50 characters each) substituted into templates
