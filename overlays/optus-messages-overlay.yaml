    x-action-class: acting
    x-consequence: write
    x-delivery-outcome: Returns 202 Accepted with a UUID. Delivery success or failure only ever arrives
      on the DLR callback - a 202 is acceptance, not delivery.
- target: $.paths['/messages'].get
  update:
    summary: Retrieve a submitted message by UUID
    x-apievangelist-note: Provider spec declares no operationId; this id is an API Evangelist convention.
    x-action-class: connected
    x-consequence: read
- target: $.components.securitySchemes.GatewayAuthorizer
  update:
    x-actual-scheme: http-basic
    x-apievangelist-note: Modelled as an apiKey in the Authorization header, but the value is a standard
      HTTP Basic credential (base64 of application-name:password). Credentials are issued per application
      at https://sms.optus.com.au/gateway/api_config/restv2.
- target: $.components.schemas.StatusCallback
  update:
    x-apievangelist-note: This schema serves double duty as the 202 submit response body and as the DLR
      callback payload. The DLR documentation publishes only four of the twelve enum values (sent, received,
      rejected, expired); accepted, queued, blocked and deficient appear only here in the spec.
    x-event-catalog: asyncapi/optus-sms-suite-asyncapi.yml
- target: $.info
  update:
