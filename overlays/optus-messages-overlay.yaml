    x-rest-v1-apievangelist-note: Not deprecated, but the documentation steers all new integrations to
      REST v2. v1 mints 64-bit integer message IDs; v2 mints UUIDs, and the two id spaces cannot be resolved
      against each other through any published operation.
    x-rest-v1-artifacts:
      authentication: authentication/optus-authentication.yml
      conventions: conventions/optus-conventions.yml
      errors: errors/optus-error-codes.yml
