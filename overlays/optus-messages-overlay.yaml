    x-apievangelist-note: Provider spec declares no operationId; this id is an API Evangelist convention.
    x-action-class: acting
    x-consequence: write
    x-blast-radius: up to 1000 handsets per call; exceeding the account limit returns broadcast_limit
- target: $.paths['/messages/{messageid}'].get
  update:
    summary: Retrieve a message by its 64-bit message ID
    x-apievangelist-note: Provider spec declares no operationId; this id is an API Evangelist convention.
    x-action-class: connected
    x-consequence: read
- target: $.components.schemas.MessageCommon
  update:
