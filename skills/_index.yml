cross_cutting_rules:
  auth: HTTP Basic with per-application credentials; no OAuth, no token endpoint.
  idempotency: None on any interface. Retrying a submit sends and bills another message. `reference` is
    a correlation label, not an idempotency key.
  delivery: Submits are accepted, not delivered. Outcomes arrive on a DLR callback configured per application,
    and on REST v2 the callback is mandatory to see error codes at all.
  identifiers: REST v1/HTTPS/SOAP/Email mint int64 ids; REST v2 mints UUIDs. They do not map to each other.
  rate_limits: None published. Build your own throttle.
  timestamps: RFC 3339, not in the past, maximum 60 days ahead.
  numbers: E.164 with a leading plus.
  highest_risk_operation: scheduleCampaign (up to 1,000,000 recipients, no dry-run, no documented cancel)
