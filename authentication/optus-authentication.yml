gaps:
- No OAuth 2.0 or OpenID Connect anywhere on the public surface.
- No scopes, so authorisation is all-or-nothing per application credential.
- No credential lifecycle API (create/rotate/revoke) and no documented rotation policy.
- No CIBA, which CAMARA specifies alongside OIDC for network-based authorization.
- Credentials on the legacy HTTPS API travel in the query string.
