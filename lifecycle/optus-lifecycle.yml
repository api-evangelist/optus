deprecation:
  policy_url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/https/
  sunset_header: false
  deprecation_header: false
  published_policy_document: false
  practice: >-
    Deprecations are announced in-page as a warning banner on the affected interface's
    documentation, with a stated intent to give advance notice, timelines, and a migration
    path before changes take effect. There is no machine-readable Sunset/Deprecation header
    (RFC 8594) and no separate versioning/deprecation policy document.
  announced:
  - api: HTTPS API
    status: deprecation-announced
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/https/
    quote: >-
      Important: We're reviewing the future of our HTTP API and expect it to be deprecated
      within the next 12 months. The API remains fully supported today. We are currently
      defining the migration path and will provide advance notice, timelines, and guidance
      before any changes take effect.
    successor: SMS Gateway REST API v2
  - api: SOAP API
    status: deprecation-announced
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/soap/
    quote: >-
      Important: We're reviewing the future of our SOAP API and expect it to be deprecated
      within the next 12 months. The API remains fully supported today. We are currently
      defining the migration path and will provide advance notice, timelines, and guidance
      before any changes take effect.
    successor: SMS Gateway REST API v2
  - api: SMS Gateway REST API v1
    status: superseded-not-deprecated
    note: >-
      Documentation steers new integrations to v2 and describes v1 as useful only for
      maintaining existing integrations, but v1 carries no deprecation notice.
  - api: Web2SMS legacy Inbox
    status: retiring
    url: https://sms.optus.com.au/docs/en/product-news/web2sms-inbox/
    note: Platform (non-API) feature announced as retiring in the 2025-08-10 product news post.
