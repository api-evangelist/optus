- aid: optus:optus-sms-suite-mms-mm7-api
  name: Optus SMS Suite MMS MM7 API
  description: >-
    Implementation of the 3GPP MM7 SOAP protocol for sending and receiving MMS, carrying text, image,
    audio, video, and SMIL content in multipart MIME requests to /mm7, with MO message and delivery-report
    callbacks acknowledged by SOAP responses. Authenticated with HTTP Basic.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/mm7/
  baseURL: https://api.sms.optus.com.au/mm7
