apis:
- aid: optus:optus-sms-suite-rest-api-v1
  name: Optus SMS Suite REST API v1
  description: >-
    JSON REST API for sending single and bulk SMS from The Optus SMS Suite, including scheduled
    sends, broadcast to a list, and retrieval of a submitted message by 64-bit message ID.
    Authenticated with HTTP Basic credentials issued per application in the SMS Suite platform.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/rest-v1/
  baseURL: https://api.sms.optus.com.au/rest/gateway
  tags:
  - SMS
  - Messaging
  - REST
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/rest-v1/
  - type: APIReference
    url: https://sms.optus.com.au/docs/api/mobile-gateway-rest-v1.html
  - type: OpenAPI
    url: openapi/optus-sms-suite-rest-v1-openapi.yml
- aid: optus:optus-sms-suite-rest-api-v2
  name: Optus SMS Suite SMS Gateway REST API v2
  description: >-
    High-volume asynchronous SMS API using UUID-based message tracking, mandatory delivery-receipt
    (DLR) callbacks, and advanced scheduling. Requests are authenticated with HTTP Basic credentials
    passed in the Authorization header via the platform's GatewayAuthorizer scheme.
  humanURL: https://sms.optus.com.au/docs/en/integrations/api-documentation/rest-v2/
  baseURL: https://api.sms.optus.com.au/rest/sms/v2
  tags:
  - SMS
  - Messaging
  - REST
  - Webhooks
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/api-documentation/rest-v2/
  - type: APIReference
    url: https://sms.optus.com.au/docs/api/mobile-gateway-rest-v2.html
  - type: OpenAPI
    url: openapi/optus-sms-suite-rest-v2-openapi.yml
- aid: optus:optus-sms-suite-campaign-manager-api
  name: Optus SMS Suite Campaign Manager API
  description: >-
    REST API v1 for programmatic control of SMS marketing campaigns — creating and managing
    recipient lists, message templates, scheduled campaigns, and per-campaign reporting, scoped
    to a named SMS Suite application.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/campaign-manager-api/
  baseURL: https://api.sms.optus.com.au/rest/campaign_manager/v1
  tags:
