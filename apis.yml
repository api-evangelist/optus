- aid: optus:optus-sms-suite-2fa-rest-api
  name: Optus SMS Suite 2FA REST API
  description: >-
    Hosted two-factor authentication API that creates an SMS one-time-code challenge for a mobile handset
    with POST /challenges and validates the user's entry with POST /responses, with customisable message
    copy, optional alphanumeric mask, and a configurable validity window. Authenticated with HTTP Basic.
    No published OpenAPI definition was found.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/2fa/
  baseURL: https://api.sms.optus.com.au/rest/2fa
