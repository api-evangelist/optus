    url: https://sms.optus.com.au/docs/en/integrations/api-documentation/health-api/
  - type: OpenAPI
    url: openapi/optus-sms-suite-status-openapi.json
  - type: StatusPage
    url: https://status.sms.optus.com.au/
- aid: optus:optus-sms-suite-2fa-rest-api
  name: Optus SMS Suite 2FA REST API
  description: >-
    Hosted two-factor authentication API that creates an SMS one-time-code challenge for a mobile
    handset with POST /challenges and validates the user's entry with POST /responses, with
    customisable message copy, optional alphanumeric mask, and a configurable validity window.
    Authenticated with HTTP Basic. No published OpenAPI definition was found.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/2fa/
  tags:
  - Two-Factor Authentication
  - Identity
  - SMS
  - REST
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/2fa/
- aid: optus:optus-sms-suite-rest-email-api
  name: Optus SMS Suite REST Email API
  description: >-
    Companion REST API to the SMS gateway for scheduling and sending plain-text transactional
    email over a separate endpoint, returning a 64-bit message ID for later retrieval and firing
    DLR callbacks when the email transport has sent the message. Plain text only — no HTML, rich
    text, or attachments. No published OpenAPI definition was found.
  humanURL: https://sms.optus.com.au/docs/en/integrations/api-documentation/rest-email/
  tags:
  - Email
  - Messaging
  - REST
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/api-documentation/rest-email/
- aid: optus:optus-sms-suite-https-api
  name: Optus SMS Suite HTTPS API
  description: >-
    Legacy GET-based HTTPS interface for SMS integration, covering message sending, delivery
    receipts, and inbound (mobile-originated) message callbacks for systems that cannot build a
    JSON REST client. No published OpenAPI definition was found.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/https/
  baseURL: https://api.sms.optus.com.au/message
  tags:
  - SMS
  - Messaging
  - HTTP
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/https/
- aid: optus:optus-sms-suite-soap-api
  name: Optus SMS Suite SOAP API
  description: >-
    WSDL-described SOAP interface for SMS integration supporting custom source addressing, message
    classification, and structured error handling, published for legacy enterprise middleware. The
    WSDL is served publicly and targets the namespace http://api.sms.optus.com.au/ModicaSoap.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/soap/
  tags:
  - SMS
  - Messaging
  - SOAP
  - WSDL
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/soap/
  - type: WSDL
    url: https://api.sms.optus.com.au/ModicaSoap.wsdl
- aid: optus:optus-sms-suite-mms-mm7-api
  name: Optus SMS Suite MMS MM7 API
  description: >-
    Implementation of the 3GPP MM7 SOAP protocol for sending and receiving MMS, carrying text,
    image, audio, video, and SMIL content in multipart MIME requests to /mm7, with MO message and
    delivery-report callbacks acknowledged by SOAP responses. Authenticated with HTTP Basic.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/mm7/
  tags:
  - MMS
  - Messaging
  - MM7
  - SOAP
  - 3GPP
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/mm7/
- aid: optus:optus-sms-suite-smpp-api
  name: Optus SMS Suite SMPP API
  description: >-
    Direct SMSC connectivity over SMPP 3.3 and 3.4 with mandatory TLS, offering high-throughput
    binary messaging, custom character encoding, and detailed delivery reporting. A wire protocol
    rather than an HTTP API — no OpenAPI definition exists or is expected.
  humanURL: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/smpp/
  tags:
  - SMS
  - Messaging
  - SMPP
  properties:
  - type: Documentation
    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/smpp/
