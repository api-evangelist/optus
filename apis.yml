    url: https://sms.optus.com.au/docs/en/integrations/messaging-apis/sms-apis/campaign-manager-api/
  - type: APIReference
    url: https://sms.optus.com.au/docs/api/campaign-manager.html
  - type: OpenAPI
    url: openapi/optus-sms-suite-campaign-manager-openapi.yml
- aid: optus:optus-sms-suite-health-monitoring-api
  name: Optus SMS Suite Health Monitoring API
  description: >-
    Unauthenticated status API returning near real-time availability for individual Optus SMS Suite
    services (rest, smpp, and others), polled every 60 seconds from an external, geographically
    distributed provider independent of the platform's own infrastructure.
  humanURL: https://sms.optus.com.au/docs/en/integrations/api-documentation/health-api/
  baseURL: https://api.sms.optus.com.au/rest/services/v1
  tags:
  - Status
  - Monitoring
  - Health
  properties:
