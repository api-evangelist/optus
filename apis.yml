- aid: optus:optus-sms-suite-rest-email-api
  name: Optus SMS Suite REST Email API
  description: >-
    Companion REST API to the SMS gateway for scheduling and sending plain-text transactional email over
    a separate endpoint, returning a 64-bit message ID for later retrieval and firing DLR callbacks when
    the email transport has sent the message. Plain text only — no HTML, rich text, or attachments. No
    published OpenAPI definition was found.
  humanURL: https://sms.optus.com.au/docs/en/integrations/api-documentation/rest-email/
  baseURL: https://api.sms.optus.com.au/rest/email/v1
