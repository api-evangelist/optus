aid: optus
url: https://raw.githubusercontent.com/api-evangelist/optus/refs/heads/main/apis.yml
name: Optus
kind: company
description: >-
  Optus (Singtel Optus Pty Limited) is Australia's second-largest telecommunications carrier,
  wholly owned by Singapore's Singtel and headquartered in Macquarie Park, Sydney. It runs a
  national mobile network reaching over 99% of the Australian population, alongside NBN and
  cable broadband, satellite capacity inherited from AUSSAT, enterprise and government
  connectivity, IoT/M2M services, and consumer media. Its API posture is split in two. The
  only genuinely public, self-serve developer surface Optus operates is The Optus SMS Suite —
  an enterprise messaging platform white-labelled from New Zealand's Modica Group at
  sms.optus.com.au, which publishes open documentation, downloadable OpenAPI/Swagger
  definitions, a WSDL, delivery-receipt callbacks, and a free-trial signup. Everything else is
  partner-gated: the IoT Control Centre is a Cisco/Jasper platform behind a referral-coded
  starter kit, and Optus has no first-party network-API portal — developer.optus.com.au and
  api.optus.com.au resolve on Akamai but return HTTP 403 Access Denied. On network APIs Optus
  is a stated GSMA Open Gateway participant and an endorser of the Bridge Alliance API
  Exchange (BAEx), but as of this review no CAMARA API is callable from Optus directly; its
  route to developers runs through its parent Singtel's Paragon-powered BAEx and Aduna, not
  through anything Optus publishes itself.
