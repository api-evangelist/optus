note: >-
  The Optus SMS Suite publishes a dated Product News section rather than a per-API changelog.
  Entries carry an author and a date and announce platform and product changes; none of the
  three current entries announce a breaking change to a messaging API contract. There is no
  API-level release-notes feed, no RSS/Atom for product news, and no version history page for
  any individual interface, so contract changes have to be tracked through the interface
  documentation pages themselves (where deprecations appear as in-page banners) and through
  scheduled-maintenance notices on the status page.
