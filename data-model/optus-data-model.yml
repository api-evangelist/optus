  Basic credential, and the Campaign Manager scopes everything under a path-level
  {application_name}. Two identifier universes coexist and do not interoperate: REST v1 / HTTPS
  / SOAP / REST Email mint 64-bit signed integer message IDs, while REST v2 mints UUIDs.
