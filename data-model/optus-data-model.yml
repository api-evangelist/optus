gaps:
  no_customer_resource: true
  no_account_or_billing_resource: true
  no_number_or_sender_id_resource: >-
    Sender IDs and short codes are provisioned through the platform and support desk, not
    through an API. The `source` and `mask` fields reference them by value only.
  no_opt_out_resource: >-
    Opt-outs are applied as a boolean (remove_opt_outs) at list and campaign creation; there is
    no API to read, add, or remove an opt-out record.
  no_cross_version_id_mapping: >-
    A REST v1 int64 message id and a REST v2 UUID cannot be resolved against each other through
    any published operation.
