finding: >-
  Optus publishes no first-party client library for any of its APIs, in any language. The
  GitHub organisation github.com/Optus exists (created 2015-09-27) but has zero public
  repositories, no name, and no description. The platform operator behind The Optus SMS Suite,
  Modica Group, has a public org (github.com/modicagroup) with only two unrelated repositories
  (a cloud-tools Docker image and Perl third-party integration examples), neither last touched
  since 2019 and neither an SDK.
substitute:
  kind: inline code samples
  note: >-
    Instead of SDKs, every API documentation page ships copy-paste request examples in curl,
    JavaScript (fetch), Python (requests), PHP (cURL), Ruby (Net::HTTP), Java
    (java.net.http.HttpClient) and C# (HttpClient). With HTTP Basic auth and small JSON bodies
    this is a workable substitute for simple sends, but it leaves retry, DLR reconciliation,
    and encoding handling to the integrator.
  languages: [curl, javascript, python, php, ruby, java, csharp]
